<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="760" viewBox="0 0 1650 760" role="img" aria-labelledby="title desc">
  <title id="title">Key Trace Comparison</title>
  <desc id="desc">Readable comparison table for three allocator strategies across four key traces.</desc>
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .panel { fill: #111827; stroke: #243041; stroke-width: 1.5; }
      .header { fill: #0f1a2b; stroke: #293548; stroke-width: 1; }
      .rowA { fill: #101a2a; }
      .rowB { fill: #0d1624; }
      .traceCell { fill: #0b1422; }
      .takeCell { fill: #0b1422; }
      .impCard { fill: #2a1d06; stroke: #f59e0b; stroke-opacity: 0.35; stroke-width: 1; }
      .expFFCard { fill: #082032; stroke: #38bdf8; stroke-opacity: 0.35; stroke-width: 1; }
      .expBFCard { fill: #0b261f; stroke: #34d399; stroke-opacity: 0.35; stroke-width: 1; }
      .title { fill: #f8fafc; font: 700 32px "DejaVu Sans Mono", monospace; }
      .subtitle { fill: #9fb3c8; font: 400 15px "DejaVu Sans", sans-serif; }
      .hdrMain { fill: #f8fafc; font: 700 18px "DejaVu Sans Mono", monospace; }
      .hdrSub { fill: #94a3b8; font: 400 12px "DejaVu Sans", sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
      .trace { fill: #f8fafc; font: 700 22px "DejaVu Sans Mono", monospace; }
      .traceNote { fill: #7f95ad; font: 400 12px "DejaVu Sans", sans-serif; letter-spacing: 0.06em; text-transform: uppercase; }
      .metric { fill: #f8fafc; font: 700 27px "DejaVu Sans Mono", monospace; }
      .metricLabel { fill: #91a4ba; font: 400 12px "DejaVu Sans", sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
      .take { fill: #dbe7f3; font: 600 18px "DejaVu Sans", sans-serif; }
      .takeSoft { fill: #9fb3c8; font: 400 14px "DejaVu Sans", sans-serif; }
      .imp { fill: #fbbf24; }
      .expFF { fill: #67e8f9; }
      .expBF { fill: #6ee7b7; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1650" height="760" />
  <rect class="panel" x="34" y="34" width="1582" height="692" rx="24" />

  <text class="title" x="70" y="86">Key Trace Comparison</text>
  <text class="subtitle" x="70" y="116">Metrics are split into stacked cards so utilization, throughput, and takeaways are easier to scan.</text>

  <rect class="header" x="60" y="154" width="240" height="62" rx="14" />
  <rect class="header" x="320" y="154" width="220" height="62" rx="14" />
  <rect class="header" x="560" y="154" width="220" height="62" rx="14" />
  <rect class="header" x="800" y="154" width="220" height="62" rx="14" />
  <rect class="header" x="1040" y="154" width="530" height="62" rx="14" />

  <text class="hdrMain" x="84" y="191">Trace</text>
  <text class="hdrSub" x="84" y="209">workload</text>

  <text class="hdrMain imp" x="430" y="185" text-anchor="middle">implicit / first_fit</text>
  <text class="hdrSub" x="430" y="204" text-anchor="middle">util + throughput</text>

  <text class="hdrMain expFF" x="670" y="185" text-anchor="middle">explicit / first_fit</text>
  <text class="hdrSub" x="670" y="204" text-anchor="middle">util + throughput</text>

  <text class="hdrMain expBF" x="910" y="185" text-anchor="middle">explicit / best_fit</text>
  <text class="hdrSub" x="910" y="204" text-anchor="middle">util + throughput</text>

  <text class="hdrMain" x="1070" y="191">Quick take</text>
  <text class="hdrSub" x="1070" y="209">what matters most</text>

  <rect class="rowA" x="60" y="238" width="1510" height="94" rx="18" />
  <rect class="rowB" x="60" y="348" width="1510" height="94" rx="18" />
  <rect class="rowA" x="60" y="458" width="1510" height="94" rx="18" />
  <rect class="rowB" x="60" y="568" width="1510" height="94" rx="18" />

  <rect class="traceCell" x="76" y="250" width="208" height="70" rx="14" />
  <rect class="traceCell" x="76" y="360" width="208" height="70" rx="14" />
  <rect class="traceCell" x="76" y="470" width="208" height="70" rx="14" />
  <rect class="traceCell" x="76" y="580" width="208" height="70" rx="14" />

  <rect class="impCard" x="325" y="250" width="210" height="70" rx="14" />
  <rect class="expFFCard" x="565" y="250" width="210" height="70" rx="14" />
  <rect class="expBFCard" x="805" y="250" width="210" height="70" rx="14" />
  <rect class="takeCell" x="1048" y="250" width="514" height="70" rx="14" />

  <rect class="impCard" x="325" y="360" width="210" height="70" rx="14" />
  <rect class="expFFCard" x="565" y="360" width="210" height="70" rx="14" />
  <rect class="expBFCard" x="805" y="360" width="210" height="70" rx="14" />
  <rect class="takeCell" x="1048" y="360" width="514" height="70" rx="14" />

  <rect class="impCard" x="325" y="470" width="210" height="70" rx="14" />
  <rect class="expFFCard" x="565" y="470" width="210" height="70" rx="14" />
  <rect class="expBFCard" x="805" y="470" width="210" height="70" rx="14" />
  <rect class="takeCell" x="1048" y="470" width="514" height="70" rx="14" />

  <rect class="impCard" x="325" y="580" width="210" height="70" rx="14" />
  <rect class="expFFCard" x="565" y="580" width="210" height="70" rx="14" />
  <rect class="expBFCard" x="805" y="580" width="210" height="70" rx="14" />
  <rect class="takeCell" x="1048" y="580" width="514" height="70" rx="14" />

  <text class="trace" x="96" y="292">amptjp-bal.rep</text>
  <text class="traceNote" x="96" y="312">high-util balanced trace</text>

  <text class="trace" x="96" y="402">random-bal.rep</text>
  <text class="traceNote" x="96" y="422">mixed random workload</text>

  <text class="trace" x="96" y="512">binary2-bal.rep</text>
  <text class="traceNote" x="96" y="532">pure throughput stress</text>

  <text class="trace" x="96" y="622">realloc-bal.rep</text>
  <text class="traceNote" x="96" y="642">realloc-heavy pattern</text>

  <text class="metricLabel" x="345" y="276">util</text>
  <text class="metric" x="345" y="304">99%</text>
  <text class="metricLabel" x="418" y="276">throughput</text>
  <text class="metric" x="418" y="304">1,181</text>
  <text class="metricLabel" x="418" y="319">Kops</text>

  <text class="metricLabel" x="585" y="276">util</text>
  <text class="metric" x="585" y="304">88%</text>
  <text class="metricLabel" x="658" y="276">throughput</text>
  <text class="metric" x="658" y="304">45,047</text>
  <text class="metricLabel" x="658" y="319">Kops</text>

  <text class="metricLabel" x="825" y="276">util</text>
  <text class="metric" x="825" y="304">99%</text>
  <text class="metricLabel" x="898" y="276">throughput</text>
  <text class="metric" x="898" y="304">34,635</text>
  <text class="metricLabel" x="898" y="319">Kops</text>

  <text class="take" x="1072" y="286">best-fit keeps utilization high;</text>
  <text class="takeSoft" x="1072" y="310">explicit first-fit still wins on raw speed.</text>

  <text class="metricLabel" x="345" y="386">util</text>
  <text class="metric" x="345" y="414">92%</text>
  <text class="metricLabel" x="418" y="386">throughput</text>
  <text class="metric" x="418" y="414">1,037</text>
  <text class="metricLabel" x="418" y="429">Kops</text>

  <text class="metricLabel" x="585" y="386">util</text>
  <text class="metric" x="585" y="414">88%</text>
  <text class="metricLabel" x="658" y="386">throughput</text>
  <text class="metric" x="658" y="414">15,539</text>
  <text class="metricLabel" x="658" y="429">Kops</text>

  <text class="metricLabel" x="825" y="386">util</text>
  <text class="metric" x="825" y="414">96%</text>
  <text class="metricLabel" x="898" y="386">throughput</text>
  <text class="metric" x="898" y="414">2,261</text>
  <text class="metricLabel" x="898" y="429">Kops</text>

  <text class="take" x="1072" y="396">best-fit gives the biggest util jump;</text>
  <text class="takeSoft" x="1072" y="420">the cost is a sharp throughput drop.</text>

  <text class="metricLabel" x="345" y="496">util</text>
  <text class="metric" x="345" y="524">51%</text>
  <text class="metricLabel" x="418" y="496">throughput</text>
  <text class="metric" x="418" y="524">91</text>
  <text class="metricLabel" x="418" y="539">Kops</text>

  <text class="metricLabel" x="585" y="496">util</text>
  <text class="metric" x="585" y="524">51%</text>
  <text class="metricLabel" x="658" y="496">throughput</text>
  <text class="metric" x="658" y="524">28,205</text>
  <text class="metricLabel" x="658" y="539">Kops</text>

  <text class="metricLabel" x="825" y="496">util</text>
  <text class="metric" x="825" y="524">51%</text>
  <text class="metricLabel" x="898" y="496">throughput</text>
  <text class="metric" x="898" y="524">1,133</text>
  <text class="metricLabel" x="898" y="539">Kops</text>

  <text class="take" x="1072" y="506">util is identical across all three;</text>
  <text class="takeSoft" x="1072" y="530">explicit first-fit dominates pure throughput.</text>

  <text class="metricLabel" x="345" y="606">util</text>
  <text class="metric" x="345" y="634">27%</text>
  <text class="metricLabel" x="418" y="606">throughput</text>
  <text class="metric" x="418" y="634">485</text>
  <text class="metricLabel" x="418" y="649">Kops</text>

  <text class="metricLabel" x="585" y="606">util</text>
  <text class="metric" x="585" y="634">26%</text>
  <text class="metricLabel" x="658" y="606">throughput</text>
  <text class="metric" x="658" y="634">492</text>
  <text class="metricLabel" x="658" y="649">Kops</text>

  <text class="metricLabel" x="825" y="606">util</text>
  <text class="metric" x="825" y="634">31%</text>
  <text class="metricLabel" x="898" y="606">throughput</text>
  <text class="metric" x="898" y="634">485</text>
  <text class="metricLabel" x="898" y="649">Kops</text>

  <text class="take" x="1072" y="616">best-fit improves utilization on reallocs;</text>
  <text class="takeSoft" x="1072" y="640">throughput stays roughly unchanged here.</text>
</svg>
