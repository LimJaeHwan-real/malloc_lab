<svg width="1860" height="1120" viewBox="0 0 1860 1120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Three-way allocator comparison</title>
  <desc id="desc">Comparison of implicit first fit, explicit first fit, and explicit best fit allocator results from mdriver -v.</desc>
  <defs>
    <style>
      .bg { fill: #161b22; }
      .panel { fill: #1f242d; stroke: #30363d; stroke-width: 2; }
      .title { fill: #f0f6fc; font: 700 32px 'SFMono-Regular', Consolas, monospace; }
      .section { fill: #e6edf3; font: 700 22px 'SFMono-Regular', Consolas, monospace; }
      .text { fill: #dce3ea; font: 18px 'SFMono-Regular', Consolas, monospace; }
      .small { fill: #9aa4af; font: 16px 'SFMono-Regular', Consolas, monospace; }
      .muted { fill: #8b949e; font: 15px 'SFMono-Regular', Consolas, monospace; }
      .imp { fill: #ffa657; }
      .expff { fill: #79c0ff; }
      .expbf { fill: #7ee787; }
      .rule { stroke: #30363d; stroke-width: 1.5; }
      .card { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
      .barbg { fill: #2d333b; }
      .label { fill: #e6edf3; font: 16px 'SFMono-Regular', Consolas, monospace; }
      .metric { fill: #f0f6fc; font: 700 24px 'SFMono-Regular', Consolas, monospace; }
    </style>
  </defs>

  <rect class="bg" width="1860" height="1120" rx="18"/>
  <rect class="panel" x="20" y="20" width="1820" height="1080" rx="16"/>

  <text class="title" x="40" y="64">Implicit / Explicit First Fit / Explicit Best Fit</text>
  <text class="small" x="40" y="96">Source: clean rebuild + ./mdriver -v on each branch</text>

  <rect x="40" y="122" width="18" height="18" class="imp" rx="4"/>
  <text class="text" x="68" y="137">implicit/first_fit</text>
  <rect x="320" y="122" width="18" height="18" class="expff" rx="4"/>
  <text class="text" x="348" y="137">explicit/first_fit</text>
  <rect x="610" y="122" width="18" height="18" class="expbf" rx="4"/>
  <text class="text" x="638" y="137">explicit/best_fit</text>

  <text class="section" x="40" y="190">Overall Summary</text>
  <line class="rule" x1="40" y1="202" x2="1820" y2="202"/>

  <rect class="card" x="40" y="226" width="540" height="150" rx="12"/>
  <text class="label" x="62" y="256">Version</text>
  <text class="label" x="250" y="256">Util</text>
  <text class="label" x="340" y="256">Kops</text>
  <text class="label" x="450" y="256">Perf</text>
  <text class="text" x="62" y="292">implicit/first_fit</text>
  <text class="text" x="250" y="292">74%</text>
  <text class="text" x="340" y="292">281</text>
  <text class="text" x="450" y="292">63/100</text>
  <text class="text" x="62" y="326">explicit/first_fit</text>
  <text class="text" x="250" y="326">71%</text>
  <text class="text" x="340" y="326">3433</text>
  <text class="text" x="450" y="326">82/100</text>
  <text class="text" x="62" y="360">explicit/best_fit</text>
  <text class="text" x="250" y="360">75%</text>
  <text class="text" x="340" y="360">1799</text>
  <text class="text" x="450" y="360">85/100</text>

  <rect class="card" x="610" y="226" width="590" height="150" rx="12"/>
  <text class="label" x="632" y="256">Util Winner</text>
  <text class="metric expbf" x="632" y="294">explicit/best_fit</text>
  <text class="small" x="632" y="322">75% total utilization</text>
  <text class="label" x="930" y="256">Speed Winner</text>
  <text class="metric expff" x="930" y="294">explicit/first_fit</text>
  <text class="small" x="930" y="322">3433 Kops total throughput</text>

  <rect class="card" x="1230" y="226" width="590" height="150" rx="12"/>
  <text class="label" x="1252" y="256">Score Winner</text>
  <text class="metric expbf" x="1252" y="294">explicit/best_fit</text>
  <text class="small" x="1252" y="322">85/100 total perf index</text>
  <text class="small" x="1252" y="350">best-fit gained utilization enough to beat first-fit overall</text>

  <text class="section" x="40" y="432">Totals At A Glance</text>
  <line class="rule" x1="40" y1="444" x2="1820" y2="444"/>

  <text class="label" x="40" y="480">Total Util</text>
  <rect class="barbg" x="180" y="462" width="520" height="24" rx="10"/>
  <rect class="imp" x="180" y="462" width="385" height="24" rx="10"/>
  <rect class="barbg" x="760" y="462" width="520" height="24" rx="10"/>
  <rect class="expff" x="760" y="462" width="369" height="24" rx="10"/>
  <rect class="barbg" x="1340" y="462" width="520" height="24" rx="10"/>
  <rect class="expbf" x="1340" y="462" width="390" height="24" rx="10"/>
  <text class="small" x="180" y="505">implicit 74%</text>
  <text class="small" x="760" y="505">explicit first fit 71%</text>
  <text class="small" x="1340" y="505">explicit best fit 75%</text>

  <text class="label" x="40" y="560">Total Kops</text>
  <rect class="barbg" x="180" y="542" width="520" height="24" rx="10"/>
  <rect class="imp" x="180" y="542" width="43" height="24" rx="10"/>
  <rect class="barbg" x="760" y="542" width="520" height="24" rx="10"/>
  <rect class="expff" x="760" y="542" width="520" height="24" rx="10"/>
  <rect class="barbg" x="1340" y="542" width="520" height="24" rx="10"/>
  <rect class="expbf" x="1340" y="542" width="272" height="24" rx="10"/>
  <text class="small" x="180" y="585">implicit 281</text>
  <text class="small" x="760" y="585">explicit first fit 3433</text>
  <text class="small" x="1340" y="585">explicit best fit 1799</text>

  <text class="label" x="40" y="640">Perf Index</text>
  <rect class="barbg" x="180" y="622" width="520" height="24" rx="10"/>
  <rect class="imp" x="180" y="622" width="328" height="24" rx="10"/>
  <rect class="barbg" x="760" y="622" width="520" height="24" rx="10"/>
  <rect class="expff" x="760" y="622" width="426" height="24" rx="10"/>
  <rect class="barbg" x="1340" y="622" width="520" height="24" rx="10"/>
  <rect class="expbf" x="1340" y="622" width="442" height="24" rx="10"/>
  <text class="small" x="180" y="665">implicit 63/100</text>
  <text class="small" x="760" y="665">explicit first fit 82/100</text>
  <text class="small" x="1340" y="665">explicit best fit 85/100</text>

  <text class="section" x="40" y="728">Key Trace Comparison</text>
  <line class="rule" x1="40" y1="740" x2="1820" y2="740"/>
  <text class="text" x="40" y="776">Trace              implicit/first_fit      explicit/first_fit      explicit/best_fit       Quick take</text>
  <text class="text" x="40" y="812">amptjp-bal.rep     99% / 1181 Kops         89% / 45047 Kops        99% / 34635 Kops        best-fit keeps util, first-fit wins speed</text>
  <text class="text" x="40" y="846">random-bal.rep     92% / 1037 Kops         88% / 15539 Kops        96% / 2261 Kops         best-fit util jump, but speed drops a lot</text>
  <text class="text" x="40" y="880">binary2-bal.rep    51% / 91 Kops           51% / 28205 Kops        51% / 1133 Kops         first-fit dominates pure throughput here</text>
  <text class="text" x="40" y="914">realloc-bal.rep    27% / 485 Kops          26% / 492 Kops          31% / 485 Kops          best-fit improves util on realloc-heavy trace</text>

  <text class="section" x="40" y="974">Bottom Line</text>
  <line class="rule" x1="40" y1="986" x2="1820" y2="986"/>
  <text class="text" x="40" y="1022">- implicit/first_fit: simple baseline, slightly better than explicit first-fit on total util, but much slower overall.</text>
  <text class="text" x="40" y="1054">- explicit/first_fit: fastest search policy of the three, but pays for that with lower space utilization.</text>
  <text class="text" x="40" y="1086">- explicit/best_fit: best overall score because utilization improves enough to outweigh the slower search.</text>
</svg>
